<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>Tic Tac Toe</title>
</head>
<body>
  <main>
  <h1>Tic Tac Toe</h1>
  <form id="players-form">
  <input type="text" id="name-x" placeholder="Joueur X">
  <input type="text" id="name-o" placeholder="Joueur O">
  <button type="submit">Démarrer</button>
</form>
  <p id="message"></p>
  <div id="board"></div>
  <button id="restart">Recommencer</button>
</main>
<script type="module" src="displayController.js"></script>
</body>
</html>
